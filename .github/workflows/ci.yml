---
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}-${{ matrix.buildtype }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        buildtype:
          - debug
          - release
        include:
          - os: macos-latest
            cc: clang
          - os: windows-latest
            cc: cl
    env:
      CC: ${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - run: brew install ninja
        if: runner.os == 'macOS'
      - run: winget install Ninja-build.Ninja
        if: runner.os == 'Windows'
      - run: python -m pip install meson
      - run: meson setup build -Dbuildtype=${{ matrix.buildtype }}
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
