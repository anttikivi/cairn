---
name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint-${{ matrix.platform.os }}-${{ matrix.platform.cc }}-${{ matrix.config.name }}-${{ matrix.buildtype }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            cc: clang
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-latest
            cc: gcc
          - os: windows-latest
            cc: cl
        buildtype:
          - debug
        config:
          - name: default
            options: ""
          - name: minimal
            options: >-
              -Dc_std=c89
              -Dstdint=disabled
              -Dstdbool=disabled
              -Dint64=disabled
          - name: c99
            options: >-
              -Dc_std=c99
              -Dstdint=enabled
              -Dstdbool=enabled
              -Dint64=enabled
          - name: c99-fallback
            options: >-
              -Dc_std=c99
              -Dstdint=disabled
              -Dstdbool=disabled
              -Dint64=enabled
    env:
      CC: ${{ matrix.platform.cc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - run: python -m pip install meson ninja
      - run: brew install cppcheck
        if: runner.os == 'macOS'
      - run: |
          sudo apt-get update
          sudo apt-get install cppcheck
        if: runner.os == 'Linux'
      - run: |
          choco install cppcheck --yes --no-progress
          $cppcheckDir = Join-Path $env:ProgramFiles "Cppcheck"
          $cppcheckDir >> $env:GITHUB_PATH
        if: runner.os == 'Windows'
        shell: pwsh
      - run: >-
          meson setup build
          -Dbuildtype=${{ matrix.buildtype }}
          ${{ matrix.config.options }}
      - run: meson compile -C build
      - run: ninja -C build cppcheck
      - run: ninja -C build clang-tidy
        if: ${{ !cancelled() }}
  test:
    name: ${{ matrix.platform.os }}-${{ matrix.platform.cc }}-${{ matrix.config.name }}-${{ matrix.buildtype }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: macos-latest
            cc: clang
          - os: ubuntu-latest
            cc: clang
          - os: ubuntu-latest
            cc: gcc
          - os: windows-latest
            cc: cl
        buildtype:
          - debug
          - release
        config:
          - name: default
            options: ""
          - name: minimal
            options: >-
              -Dc_std=c89
              -Dstdint=disabled
              -Dstdbool=disabled
              -Dint64=disabled
          - name: c99
            options: >-
              -Dc_std=c99
              -Dstdint=enabled
              -Dstdbool=enabled
              -Dint64=enabled
          - name: c99-fallback
            options: >-
              -Dc_std=c99
              -Dstdint=disabled
              -Dstdbool=disabled
              -Dint64=enabled
    env:
      CC: ${{ matrix.platform.cc }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.13"
      - uses: ilammy/msvc-dev-cmd@v1.13.0
        if: runner.os == 'Windows'
      - run: python -m pip install meson ninja
      - run: >-
          meson setup build
          -Dbuildtype=${{ matrix.buildtype }}
          ${{ matrix.config.options }}
      - run: meson compile -C build
      - run: meson test -C build --print-errorlogs
