---
image: alpine/latest

packages:
  - build-base
  - clang
  - meson

environment:
  CC: gcc
  UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

sources:
  - https://git.sr.ht/~anttikivi/cairn

tasks:
  - gcc_default: |
      CONF_NAME=gcc_default
      cd cairn
      meson setup "build/${CONF_NAME}" -Dbuildtype=debug
      meson compile -C "build/${CONF_NAME}"
      meson test -C "build/${CONF_NAME}" --print-errorlogs

  - gcc_default_release: |
      CONF_NAME=gcc_default_release
      cd cairn
      meson setup "build/${CONF_NAME}" -Dbuildtype=release
      meson compile -C "build/${CONF_NAME}"
      meson test -C "build/${CONF_NAME}" --print-errorlogs

  - gcc_default_asan_ubsan: |
      CONF_NAME=gcc_default_asan_ubsan
      cd cairn
      meson setup "build/${CONF_NAME}" -Dbuildtype=debug -Db_sanitize=address,undefined
      meson compile -C "build/${CONF_NAME}"
      meson test -C "build/${CONF_NAME}" --print-errorlogs
