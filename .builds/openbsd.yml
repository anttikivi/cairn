---
image: openbsd/latest

packages:
  - meson

environment:
  CC: clang

sources:
  - https://git.sr.ht/~anttikivi/cairn

tasks:
  - clang_default: |
      CONF_NAME=clang_default
      cd cairn
      meson setup "build/${CONF_NAME}" -Dbuildtype=debug
      meson compile -C "build/${CONF_NAME}"
      meson test -C "build/${CONF_NAME}" --print-errorlogs

  - clang_default_release: |
      CONF_NAME=clang_default_release
      cd cairn
      meson setup "build/${CONF_NAME}" -Dbuildtype=release
      meson compile -C "build/${CONF_NAME}"
      meson test -C "build/${CONF_NAME}" --print-errorlogs
